# deploy/test-env/nginx-mokaco-test.conf -> /etc/nginx/sites-available/mokaco-test (+ symlink in
# sites-enabled). test.hrms.mokanco.com.lb -> the TEST API on 127.0.0.1:5079 and its own copy of the
# front end. Production's sites (mokaco, mokaco-default, mokanco-site) are not touched.
#
# A SUBDOMAIN, not /test/ on the production host: neither the front end (no Vite base, no router
# basename, /login hard-coded) nor the API (no UsePathBase) works under a path prefix.
#
# NOT PROXIED HERE: /iclock. The fingerprint terminals belong to production; a terminal pointed at
# this host would put real punches into the test database only.
#
# nginx 1.24: "listen ... http2", not the "http2 on;" of 1.25+. Check with: sudo nginx -t

# Own variable name: conf.d/mokaco-upgrade-map.conf already defines production's, and a second map
# of the same name fails nginx -t.
map $http_upgrade $mokaco_test_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name test.hrms.mokanco.com.lb;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test.hrms.mokanco.com.lb;

    # Self-signed until Let's Encrypt (README step 7); certbot --nginx rewrites these two lines.
    ssl_certificate     /etc/mokaco/tls/test.crt;
    ssl_certificate_key /etc/mokaco/tls/test.key;

    # Optional second lock in front of a copy of real staff data: allow your own addresses only.
    # (Not basic auth - the API's Bearer token uses the same Authorization header.)
    # allow <office or home public IP>;
    # deny all;

    # A copy of production's names and documents: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Match production's site (sites-available/mokaco) if it allows bigger uploads.
    client_max_body_size 20m;

    root /var/www/mokaco-web-test;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5079;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # SignalR: /hubs/live (staff) and /hubs/booking. WebSockets need the Upgrade pair and a long read.
    location /hubs/ {
        proxy_pass http://127.0.0.1:5079;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mokaco_test_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5079;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The single-page app: any other path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
